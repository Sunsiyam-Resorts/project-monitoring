# Project Monitoring portal (Go backend serving the React frontend, built from the Dockerfile) + PostgreSQL,
# served at https://project.ssrsys.com through the server's Cloudflare Tunnel.
# Configure .env first (see .env.example and docs/DEPLOYMENT.md), then:
#   docker compose up -d --build
# The database lives in the named volume "pgdata". Never run `docker compose down -v`: it deletes the database.
name: project-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal -d portal"]
      interval: 10s
      timeout: 5s
      retries: 6
    # No published port: only the portal container can reach the database.
    logging: *logging

  portal:
    build: .
    image: project-monitoring:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgres://portal:${POSTGRES_PASSWORD}@db:5432/portal
      HOST: 0.0.0.0
      PORT: "3000"
      # Users reach the portal over HTTPS (https://project.ssrsys.com via the server's Cloudflare Tunnel),
      # so the session cookie is marked Secure. (The variable keeps its Node.js-era name.)
      NODE_ENV: production
    ports:
      # Reachable only from the server itself, where cloudflared forwards to http://localhost:3080.
      # (3000 on the server is already used by the ERP.)
      - "127.0.0.1:${PORTAL_PORT:-3080}:3000"
    logging: *logging

volumes:
  pgdata:
